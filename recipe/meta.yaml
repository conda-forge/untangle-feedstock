{% set version = "1.3.1" %}
{% set name = "untangle" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6cac211f4d877935c1a62f543d40a596f3e4afe44380c4f6a2a1d4428214a5d0

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python
    - pip
  run:
    - python

test:
  imports:
    - untangle

about:
  home: https://github.com/stchris/untangle
  license: MIT
  license_file: 'LICENSE'
  summary: 'Convert XML documents into Python objects.'
  doc_url: https://untangle.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - htenkanen
