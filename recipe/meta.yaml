{% set version = "1.3.0" %}
{% set name = "untangle" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2a0add33ecd61faf155ace1fcdb6fd9ed74f42ec976942b221f6c7f6c0a47bef

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python
    - pip
  run:
    - python

test:
  imports:
    - untangle

about:
  home: https://github.com/stchris/untangle
  license: MIT
  license_file: 'LICENSE'
  summary: 'Convert XML documents into Python objects.'
  doc_url: https://untangle.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - htenkanen
